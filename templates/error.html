{% extends "layout.html" %}

{% block title %}{{ message }} | JanSaathi{% endblock %}

{% block content %}
<main class="empty-page">
    <span class="contact-symbol">?</span>
    <p class="section-kicker">JanSaathi</p>
    <h1>{{ message }}</h1>
    <p>{{ detail|default('The requested page is not available.') }}</p>
    <div class="hero-actions">
        <a class="primary-button inline-button" href="{{ url_for('index') }}">
            Go home <span>→</span>
        </a>
        <a class="text-link" href="{{ url_for('search') }}">Search challenges</a>
    </div>
</main>
{% endblock %}
